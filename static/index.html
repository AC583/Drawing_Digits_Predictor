<!DOCTYPE html>
<html>

<head>
    <title>MNIST Digit Recognizer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Draw a digit</h1>

    <canvas id="canvas" width="600" height="400">
    </canvas>

    <div>
        <button id="clear">Clear</button>
    </div>

    <h2 id="prediction">
        Prediction: -
    </h2>

    <p id="confidence"></p>

    <div id="processed-container" style="display: none; margin-top: 20px;">
        <h3>Model Input (28x28):</h3>
        <div id="processedImages"></div>
    </div>

    <script src="script.js"></script>

</body>

</html>
